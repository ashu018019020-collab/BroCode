# BroCode deployment blueprint — Render Blueprint (Infrastructure as Code).
#
# Deploys the two long-running pieces, in one Apply:
#   · brocode-voice   — the Python Supertonic 3 service (CPU inference, checkpoint on a disk).
#   · brocode-account — the Node account API (`server/index.mjs`). The website stays on Vercel; the
#                       Vercel Functions in `api/voice/` reach the voice service through
#                       `TTS_SERVICE_URL` and authenticate with the same `TTS_SERVICE_SECRET`.
#
# The blueprint wires the pair: `brocode-account` takes both the URL and the generated secret from
# `brocode-voice`, so the token is typed nowhere. Only the Supabase keys are asked for at Apply time
# (`sync: false`) — they are never written into this file.
#
#   https://dashboard.render.com/blueprints → New Blueprint Instance → this repository → Apply
#
# What Render does:
#   1. Builds services/supertonic-tts/Dockerfile (Python 3.12 + supertonic[serve] 1.3.1).
#   2. Mounts a 10 GB disk at /models and caches the 398 MB checkpoint there, so a redeploy or
#      restart does NOT download it again. The model is never in the image or in Git.
#   3. Generates TTS_SERVICE_SECRET once. Paste the SAME value into Vercel's environment.
#   4. Waits for /healthz (200 only when the model is loaded), then routes HTTPS to it.
#
# Cost: the Starter plan is the cheapest that allows a persistent disk and no sleep. A free instance
# cannot hold the model and would re-download it on every cold start. Nothing is created until the
# owner clicks Apply — this file alone incurs no charge.
services:
  - type: web
    name: brocode-voice
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    dockerContext: .
    dockerfilePath: ./services/supertonic-tts/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: brocode-voice-models
      mountPath: /models
      sizeGB: 10
    envVars:
      - key: TTS_SERVICE_SECRET
        generateValue: true
      - key: SUPERTONIC_MODEL
        value: supertonic-3
      # The exact revision the SDK pins; declared here so a package bump cannot change the voice
      # without a review.
      - key: SUPERTONIC_MODEL_REVISION
        value: 724fb5abbf5502583fb520898d45929e62f02c0b
      - key: SUPERTONIC_CACHE_DIR
        value: /models/supertonic3
      - key: SUPERTONIC_STYLE
        value: F1
      - key: SUPERTONIC_STEPS
        value: "8"
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"

  # The account API the browser calls for sign-in verification and progress history. It is a plain
  # Node server (`npm run dev:api` runs the same file locally), so Render runs the repository as-is.
  # Everything optional stays optional: without `DATABASE_URL` it runs on Supabase Auth alone, and
  # `npm run db:deploy` is what creates the progress tables (run it once from a machine that has the
  # real DATABASE_URL — a build step must never migrate production data).
  - type: web
    name: brocode-account
    runtime: node
    plan: starter
    region: singapore
    branch: main
    # `--include=dev` is required: vite/typescript are devDependencies, and Render prunes them by
    # default when NODE_ENV=production. The build script itself needs no compiler for the API.
    buildCommand: npm ci --include=dev
    # Render injects PORT; `server/index.mjs` prefers API_PORT, so PORT must be the one it listens on.
    startCommand: node server/index.mjs
    healthCheckPath: /api/voice/status
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://mybrocode.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Optional: add DATABASE_URL / DIRECT_URL in the dashboard to enable server-side progress history.
      # Taken from the voice service, so the shared token exists exactly once.
      - key: TTS_SERVICE_URL
        fromService:
          name: brocode-voice
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TTS_SERVICE_SECRET
        fromService:
          name: brocode-voice
          type: web
          envVarKey: TTS_SERVICE_SECRET
      - key: TTS_SERVICE_TIMEOUT_MS
        value: "20000"
