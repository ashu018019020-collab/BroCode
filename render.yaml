# BroCode deployment blueprint — Render Blueprint (Infrastructure as Code).
#
# Deploys the ONE long-running piece BroCode needs:
#   · brocode-account — the Node account API (`server/index.mjs`). The website stays on Vercel.
#
# The voice is synthesised by THIS API (Azure AI Speech) and streamed to the browser as MP3, so
# there is no model host, no GPU and nothing for a visitor to download. Add AZURE_SPEECH_KEY and
# AZURE_SPEECH_REGION in the dashboard (sync: false — never in this file); without them the voice
# route answers 503 and the UI says so instead of pretending.
#
# Only the Supabase keys are asked for at Apply time (`sync: false`) — they are never written here.
#
#   https://dashboard.render.com/blueprints → New Blueprint Instance → this repository → Apply
services:
  # The account API the browser calls for sign-in verification and progress history. It is a plain
  # Node server (`npm run dev:api` runs the same file locally), so Render runs the repository as-is.
  # Everything optional stays optional: without `DATABASE_URL` it runs on Supabase Auth alone, and
  # `npm run db:deploy` is what creates the progress tables (run it once from a machine that has the
  # real DATABASE_URL — a build step must never migrate production data).
  - type: web
    name: brocode-account
    runtime: node
    plan: starter
    region: singapore
    branch: main
    # `--include=dev` is required: vite/typescript are devDependencies, and Render prunes them by
    # default when NODE_ENV=production. The build script itself needs no compiler for the API.
    buildCommand: npm ci --include=dev
    # Render injects PORT; `server/index.mjs` prefers API_PORT, so PORT must be the one it listens on.
    startCommand: node server/index.mjs
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://mybrocode.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Optional: add DATABASE_URL / DIRECT_URL in the dashboard to enable server-side progress history.
      # Voice: add AZURE_SPEECH_KEY + AZURE_SPEECH_REGION here too. Both are server-only secrets.
